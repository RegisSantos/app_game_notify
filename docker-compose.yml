name: 'app_game_notify'

services:
  postgres:
    image: postgres:16-alpine
    container_name: app_game_notify_postgres
    environment:
      POSTGRES_DB: app_game_notify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - game-network

  redis:
    image: redis:7-alpine
    container_name: app_game_notify_redis
    ports:
      - "6379:6379"
    networks:
      - game-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: app_game_notify_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - game-network

volumes:
  pgdata:

networks:
  game-network:
    driver: bridge